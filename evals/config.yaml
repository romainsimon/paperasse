workspace: evals-workspace
model: claude-sonnet-4-6
grading_model: claude-haiku-4-5-20251001  # haiku is fast + cheap for PASS/FAIL grading
global_paths:
  - evals/
  - package.json

# baseline_prompt: what a user would reasonably type without the skill
# tools: tools available during skill runs (Read for file access)
skills:
  reviseur-entreprises:
    path: reviseur-entreprises
    baseline_prompt: "Tu es un réviseur d'entreprises (IRE). Analyse les données comptables fournies et donne ton opinion d'audit."
    tools: "Read"
    shared_paths:
      - data/
      - company.example.json
  controleur-fiscal:
    path: controleur-fiscal
    baseline_prompt: "Tu es un inspecteur des impôts. Analyse ces données fiscales et identifie les anomalies."
    tools: "Read"
    shared_paths:
      - data/
      - company.example.json
  notaire:
    path: notaire
    baseline_prompt: "Tu es un notaire expérimenté en droit belge. Réponds à cette question avec les calculs détaillés."
    tools: "Read"
    shared_paths:
      - scripts/fetch_notaire_data.py
      - scripts/test_fetch_notaire_data.py
  comptable:
    path: comptable
    baseline_prompt: "Tu es un expert-comptable belge. Aide avec cette question de comptabilité belge."
    tools: "Read,Bash"
    shared_paths:
      - data/
      - scripts/
      - templates/
      - integrations/
      - company.example.json
  syndic:
    path: syndic
    baseline_prompt: "Tu es un syndic de copropriété expérimenté en droit belge (ACP). Aide avec cette question."
    tools: "Read"
  fiscaliste:
    path: fiscaliste
    baseline_prompt: "Tu es un fiscaliste spécialisé en fiscalité des particuliers belges. Réponds à cette question avec les calculs détaillés."
    tools: "Read"
    shared_paths:
      - fiscaliste/foyer.example.json
